<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lapiko</title>
<meta name="theme-color" content="#EDEFEE">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lapiko">
<meta property="og:title" content="Lapiko · Recetario">
<meta property="og:description" content="Ábrelo para ver la receta completa y guardarla en tu recetario.">
<meta property="og:image" content="https://mikel-ac.github.io/lapiko/icon-192.png">
<meta property="og:image:width" content="192">
<meta property="og:image:height" content="192">
<meta property="og:url" content="https://mikel-ac.github.io/lapiko/">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEFEE;--paper-2:#E3E6E5;--surface:#FFFFFF;
    --ink:#16191A;--ink-soft:#5f6362;--ink-faint:#9a9d9c;
    --accent:#F25C1F;--accent-deep:#d44a12;
    --line:#c9cccb;--line-strong:#b3b6b5;--shadow:rgba(20,25,26,.10);
    --radius:12px;--radius-sm:9px;
    --serif:"Space Grotesk",system-ui,sans-serif;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:1rem;color:inherit}
  ::selection{background:var(--accent);color:#fff}
  .app{position:relative;z-index:1;max-width:1140px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  header.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:13px 18px;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ink)}
  .brand{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0}
  .brand .dot{width:9px;height:9px;background:var(--accent);border-radius:1px}
  .brand h1{font-family:var(--serif);font-weight:700;font-size:1.32rem;letter-spacing:-.01em;color:var(--ink)}
  .nav-desk{display:flex;gap:4px;margin-left:6px}
  .nav-desk button{font-family:var(--mono);font-weight:500;font-size:.78rem;letter-spacing:.04em;padding:8px 13px;border-radius:8px;color:var(--ink-soft);transition:.16s}
  .nav-desk button:hover{background:var(--paper-2);color:var(--ink)}
  .nav-desk button.on{color:var(--accent)}
  .search-wrap{margin-left:auto;position:relative;flex:1;max-width:300px}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
  .search-wrap input{width:100%;border:1px solid var(--ink);background:var(--surface);border-radius:8px;padding:9px 13px 9px 36px;outline:none;transition:.16s;font-size:.9rem}
  .search-wrap input:focus{box-shadow:0 0 0 3px rgba(242,92,31,.16)}
  .acct{flex-shrink:0;width:38px;height:38px;border-radius:50%;border:1px solid var(--ink);background:var(--surface);display:grid;place-items:center;color:var(--ink-soft);transition:.16s}
  .acct:hover{color:var(--accent);border-color:var(--accent)}

  main{flex:1;padding:20px 18px 120px;animation:fade .34s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  .page-head{margin-bottom:14px}
  .page-head .kicker{font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .page-head h2{font-family:var(--serif);font-size:1.9rem;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-top:5px}
  .page-head p{color:var(--ink-soft);margin-top:6px;max-width:46ch}

  .seg{display:flex;flex:1;min-width:180px;border:1px solid var(--ink);border-radius:8px;overflow:hidden}
  .seg button{flex:1;font-family:var(--mono);font-weight:500;font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;padding:9px 8px;color:var(--ink-soft);transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--ink);color:var(--paper)}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
  .tools-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto}
  .toolbar .spacer{flex:1;min-width:0}
  .sortbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--surface);border-radius:8px;padding:9px 12px;font-family:var(--mono);font-weight:500;font-size:.76rem;color:var(--ink-soft);transition:.15s;white-space:nowrap;flex-shrink:0}
  .sortbtn:hover{color:var(--ink)}
  .sortbtn .si{font-size:.95rem;line-height:1}
  .sortbtn .sl{display:none}
  .dice{width:38px;height:38px;flex-shrink:0;border-radius:8px;border:1px solid var(--ink);background:var(--surface);font-size:16px;display:grid;place-items:center;transition:.15s}
  .dice:hover{background:var(--paper-2);transform:rotate(10deg)}
  .optrow{display:flex;flex-direction:column;gap:8px}
  .optrow button{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--ink);background:var(--surface);border-radius:9px;padding:13px 15px;font-weight:600;font-size:.96rem;color:var(--ink);transition:.15s}
  .optrow button.on{background:var(--ink);color:var(--paper)}
  .optrow .ck{color:var(--accent)}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:0;scrollbar-width:none;scroll-behavior:smooth}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;border:1px solid var(--line-strong);background:var(--surface);padding:7px 13px;border-radius:999px;font-family:var(--mono);font-weight:500;font-size:.74rem;letter-spacing:.02em;color:var(--ink-soft);transition:.15s;flex-shrink:0}
  .chip:hover{border-color:var(--ink);color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

  .chips-wrap{position:relative;margin-bottom:12px}
  .hbar{display:none;width:100px;height:6px;margin:11px auto 0;background:var(--line);border-radius:99px;position:relative;cursor:pointer}
  .hthumb{position:absolute;top:0;height:100%;min-width:22px;background:var(--ink-faint);border-radius:99px;cursor:grab;transition:background .14s}
  .hthumb:hover{background:var(--ink-soft)}
  .hthumb.drag{background:var(--ink);cursor:grabbing}
  @media(min-width:761px){.hbar.show{display:block}}
  .results-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 6px}
  .results-count{font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
  .clear-filters{font-family:var(--mono);font-weight:600;font-size:.74rem;letter-spacing:.04em;color:var(--accent);padding:6px 10px;border-radius:7px;transition:.14s}
  .clear-filters:hover{background:rgba(242,92,31,.12)}

  .grid{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .card{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;animation:pop .4s both;transition:background .14s}
  .card:hover{background:var(--paper-2)}
  .card:active{transform:scale(.995)}
  .lpk-box{position:relative;width:48px;height:48px;flex-shrink:0;border:1px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);line-height:1.05;overflow:hidden}
  .lpk-box b{font-size:8px;letter-spacing:.1em;color:var(--ink-faint);font-weight:500}
  .lpk-box span{font-size:15px;font-weight:600}
  .lpk-box.fav::before{content:"";position:absolute;top:0;right:0;border-width:0 14px 14px 0;border-style:solid;border-color:transparent var(--accent) transparent transparent}
  .lpk-box.wish::before{content:"";position:absolute;top:0;right:0;border-width:0 14px 14px 0;border-style:solid;border-color:transparent var(--ink) transparent transparent}
  .lpk-main{flex:1;min-width:0}
  .lpk-main h3{font-family:var(--serif);font-weight:600;font-size:1.04rem;letter-spacing:-.005em;line-height:1.15;color:var(--ink);overflow-wrap:anywhere}
  .card-data{font-family:var(--mono);font-size:.71rem;color:var(--ink-faint);margin-top:3px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-reason{font-family:var(--mono);font-size:.71rem;color:var(--accent);margin-top:3px}
  .card-arrow{font-family:var(--mono);color:var(--ink-faint);flex-shrink:0;font-size:.95rem}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-faint)}
  .empty .e{font-size:42px;margin-bottom:10px}

  .back{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.76rem;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:14px;transition:.16s}
  .back:hover{color:var(--accent)}
  .fhead{margin-bottom:16px;border-bottom:1px solid var(--ink);padding-bottom:16px}
  .fkick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:22px}
  .lpk-chip{font-family:var(--mono);font-weight:600;font-size:.68rem;letter-spacing:.09em;border:1px solid var(--ink);border-radius:5px;padding:4px 8px;color:var(--ink);flex-shrink:0}
  .fsrc{font-family:var(--mono);font-size:.71rem;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .ftitle{font-family:var(--serif);font-size:2.3rem;font-weight:700;letter-spacing:-.028em;line-height:1.1;margin-top:12px;overflow-wrap:anywhere}
  .rtags{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .rtag{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line-strong);border-radius:999px;padding:4px 11px;color:var(--ink-soft);cursor:pointer;transition:.14s}
  .rtag:hover{border-color:var(--ink);color:var(--ink)}
  .rtag.pri{border-color:var(--accent);color:var(--accent)}

  .iorow{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}
  .io-toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:10px 14px;font-family:var(--mono);font-weight:500;font-size:.78rem;color:var(--ink-soft);transition:.15s}
  .io-toggle.on{border-color:var(--accent);color:var(--accent)}
  .io-toggle.wish.on{border-color:var(--ink);color:var(--ink)}
  .stat-strip{display:flex;flex-wrap:nowrap;gap:0;margin-bottom:14px;border:1px solid var(--ink);border-radius:var(--radius-sm);overflow:hidden}
  .statp{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-right:1px solid var(--line);flex:1;min-width:0}
  .statp:last-child{border-right:none}
  .statp .k{font-family:var(--mono);font-size:.62rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .statp .vv{font-family:var(--mono);font-weight:600;font-size:1rem;line-height:1;white-space:nowrap}
  .statp .vv .off{color:var(--line-strong)} .statp .vv .on{color:var(--ink)}
  .cooked-line{display:flex;align-items:center;gap:8px;background:var(--paper-2);border-radius:8px;padding:9px 13px;font-size:.84rem;color:var(--ink-soft);font-weight:500;margin-bottom:14px}
  .cooked-line b{color:var(--ink)}
  .detail-actions{display:flex;gap:9px;margin:0 0 22px;flex-wrap:wrap}
  .rtag.static{cursor:default}
  .photo-band{height:190px;border:1px solid var(--line-strong);border-radius:10px;background-size:cover;background-position:center;margin-top:16px}

  .sec-h{font-family:var(--serif);font-size:1.25rem;font-weight:700;letter-spacing:-.01em;margin-bottom:13px;display:flex;align-items:center;gap:9px}
  .sec-h .num{font-family:var(--mono);font-size:.66rem;background:var(--ink);color:var(--paper);padding:5px 7px;border-radius:5px;display:grid;place-items:center;font-weight:500;letter-spacing:.06em}
  .servings{display:flex;align-items:center;gap:14px;background:var(--paper-2);border-radius:var(--radius-sm);padding:9px 13px;margin-bottom:14px}
  .servings .lbl{font-family:var(--mono);font-weight:500;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-right:auto}
  .stepper{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--ink);border-radius:8px;padding:2px}
  .stepper button{width:30px;height:30px;border-radius:6px;font-size:1.15rem;font-weight:700;color:var(--accent);display:grid;place-items:center;transition:.14s}
  .stepper button:hover{background:var(--paper-2)}
  .stepper .n{min-width:32px;text-align:center;font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
  ul.ings{list-style:none;display:flex;flex-direction:column;gap:0}
  ul.ings li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:.14s}
  ul.ings li:hover{background:var(--surface)}
  ul.ings li .box{width:20px;height:20px;border:1px solid var(--ink);border-radius:5px;flex-shrink:0;display:grid;place-items:center;transition:.16s}
  ul.ings li.done .box{background:var(--ink);border-color:var(--ink)}
  ul.ings li.done .box svg{opacity:1}
  ul.ings li .box svg{opacity:0;color:#fff;transition:.16s}
  ul.ings li.done .name{text-decoration:line-through;color:var(--ink-faint)}
  ul.ings li .qty{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);min-width:74px}
  ul.ings li .name{flex:1}
  .prep{border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden;background:var(--surface)}
  .prep-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 15px;font-family:var(--mono);font-weight:500;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
  .prep-head>span:first-child{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prep-head .chev{color:var(--accent);font-size:1.2rem;transition:.22s;line-height:1;flex-shrink:0;margin-left:10px}
  .prep.coll .chev{transform:rotate(-90deg)}
  .prep-body{padding:0 13px 4px}
  .prep.coll .prep-body{display:none}
  .prep .ings li:last-child{border-bottom:none}
  .prep-steps{margin-bottom:22px}
  .prep-sub{font-family:var(--mono);font-size:.76rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:9px}
  .prep-sub::before{content:"";width:14px;height:2px;background:var(--accent)}
  .ing-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--mono);font-weight:500;font-size:.8rem;letter-spacing:.03em;padding:12px 17px;border-radius:9px;transition:.16s;border:1px solid var(--ink);text-transform:uppercase}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
  .btn-ghost{background:var(--surface);color:var(--ink)}
  .btn-ghost:hover{background:var(--paper-2)}
  .btn-block{width:100%}
  ol.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:11px}
  ol.steps li{counter-increment:s;display:flex;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 15px}
  ol.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--mono);font-weight:600;font-size:.9rem;color:var(--accent);background:var(--paper-2);width:32px;height:32px;border-radius:7px;display:grid;place-items:center;flex-shrink:0}
  ol.steps li .stext{flex:1;padding-top:5px}
  ol.steps li .tmr{font-family:var(--mono);font-size:.72rem;font-weight:500;color:var(--ink-soft);margin-top:6px;display:inline-flex;align-items:center;gap:5px}
  .yt{display:flex;align-items:center;gap:10px;width:100%;color:var(--ink);font-family:var(--mono);font-weight:500;font-size:.78rem;letter-spacing:.03em;margin-top:14px;padding:12px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);text-decoration:none;transition:.15s}
  .yt .yt-src{margin-left:auto;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
  .yt:hover{border-color:var(--ink);background:var(--paper)}
  .yt:hover .yt-src{color:var(--accent)}
  .yt:hover{background:var(--paper-2)}

  .notes-sec{margin-top:30px;border-top:1px solid var(--ink);padding-top:22px}
  .notes-intro{color:var(--ink-soft);font-size:.88rem;margin:-4px 0 14px;max-width:54ch}
  .log{display:flex;flex-direction:column;gap:10px;margin:14px 0 16px}
  .logentry{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:11px 15px}
  .logentry.bare{border-left-color:var(--line-strong)}
  .le-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .le-date{font-family:var(--mono);font-weight:600;font-size:.84rem;color:var(--ink)}
  .logentry.bare .le-date{color:var(--ink-soft)}
  .le-del{color:var(--ink-faint);font-size:.85rem;width:28px;height:28px;border-radius:7px;transition:.14s}
  .le-del:hover{background:var(--paper-2);color:var(--accent)}
  .le-text{color:var(--ink);line-height:1.5;white-space:pre-wrap;margin-top:5px}
  .le-bare{color:var(--ink-faint);font-size:.8rem;font-weight:500;margin-top:1px}
  .log-actions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:8px}
  .composer{display:none;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--ink);border-radius:var(--radius-sm);padding:14px;margin-top:10px}
  .composer.show{display:flex}
  .composer input,.composer textarea{border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:11px 13px;outline:none;font-family:inherit;font-size:1rem;transition:.14s}
  .composer input:focus,.composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,92,31,.14)}
  .composer textarea{min-height:80px;resize:vertical;line-height:1.5}
  .composer-actions{display:flex;gap:10px;justify-content:flex-end}
  .composer-actions .btn{padding:10px 15px}

  .form{max-width:680px}
  .form-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:66px;z-index:30;background:color-mix(in srgb,var(--paper) 93%,transparent);backdrop-filter:blur(8px);border:1px solid var(--ink);border-radius:11px;padding:9px 9px 9px 14px;margin-bottom:16px;box-shadow:0 4px 14px rgba(20,25,26,.07)}
  .form-bar-label{font-family:var(--mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .form-bar-btns{display:flex;gap:8px;flex-shrink:0}
  .form-bar .btn{width:auto;padding:9px 16px}
  .form-bar.editing{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent),0 4px 14px rgba(242,92,31,.10)}
  .form-bar.editing .form-bar-label{color:var(--accent)}
  .edit-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;flex-shrink:0}
  @media(min-width:761px){.form-bar{top:70px;padding:9px 10px 9px 16px;gap:14px}}
  .form-foot{display:flex;gap:10px;margin-top:6px}
  .form-foot .btn{flex:1}
  .shop-add{display:flex;gap:9px;margin-bottom:18px}
  .shop-add input{flex:1;font-family:var(--sans);font-size:.95rem;padding:11px 13px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink)}
  .shop-add input:focus{outline:none;border-color:var(--ink)}
  .shop-add .btn{width:auto;padding:11px 18px}
  .taglist-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 12px}

function normRecipe(r,i){
  if(!r||typeof r!=='object')return;
  if(!Array.isArray(r.cat))r.cat=Array.isArray(r.tags)?r.tags.slice():[];
  if('tags' in r)delete r.tags;
  if(!Array.isArray(r.preps))r.preps=[];
  r.preps.forEach(p=>{if(!p||typeof p!=='object')return;if(!Array.isArray(p.ings))p.ings=[];if(!Array.isArray(p.steps))p.steps=[]});
  if(!Array.isArray(r.log))r.log=[];

  if(typeof r.cost!=='number')r.cost=+r.cost||1;
  if(typeof r.servings!=='number')r.servings=+r.servings||2;
  if(typeof r.time!=='number')r.time=+r.time||0;
  if(r.name==null)r.name="";
}

function ensureLpk(){let max=0;recipes.forEach(r=>{if(typeof r.lpk==='number'&&r.lpk>max)max=r.lpk});if(max>lpkSeq)lpkSeq=max;recipes.filter(r=>typeof r.lpk!=='number').sort((a,b)=>(a.added||0)-(b.added||0)).forEach(r=>{r.lpk=++lpkSeq})}

function ingMatch(r,q){return allIngs(r).find(i=>i.n.toLowerCase().includes(q))}
function matchInfo(r,q){
  if(!q) return {ok:true,reason:""};
  if(r.name.toLowerCase().includes(q)) return {ok:true,reason:""};
  const ig=ingMatch(r,q); if(ig) return {ok:true,reason:"lleva "+ig.n};
  if((r.cat||[]).some(c=>c.toLowerCase().includes(q))) return {ok:true,reason:""};
  return {ok:false,reason:""};
}
function filtered(){
  let arr=recipes.filter(r=>{
    if(state.col==='fav'&&!r.fav)return false;
    if(state.col==='wish'&&!r.wish)return false;
    if(!state.filters.every(t=>(r.cat||[]).includes(t)))return false;
    return matchInfo(r,state.q).ok;
  });
  const s=state.sort;
  arr.sort((a,b)=>{
    if(s==='fast')return a.time-b.time;
    if(s==='cheap')return (a.cost-b.cost)||(a.time-b.time);
    if(s==='favfirst')return (b.fav-a.fav)||(b.added-a.added);
    return b.added-a.added;
  });
  return arr.map(r=>({r,reason:matchInfo(r,state.q).reason}));
}

function setupChips(){
  const el=document.getElementById('chipScroll'); if(!el)return;
  const bar=document.getElementById('chipBar'), thumb=document.getElementById('chipThumb');
  function update(){
    const max=el.scrollWidth-el.clientWidth;
    if(max<=1){if(bar)bar.classList.remove('show');return}
    if(bar)bar.classList.add('show');
    if(!bar||!thumb)return;
    const tw=bar.clientWidth, thw=Math.max(22, tw*(el.clientWidth/el.scrollWidth));
    thumb.style.width=thw+'px';
    thumb.style.left=((tw-thw)*(el.scrollLeft/max))+'px';
  }
  el.onscroll=update;
  el.addEventListener('wheel',function(e){if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){el.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
  if(thumb){
    let drag=null;
    thumb.addEventListener('pointerdown',function(e){e.preventDefault();const tw=bar.clientWidth,thw=thumb.offsetWidth;drag={x:e.clientX,sl:el.scrollLeft,range:Math.max(1,tw-thw),max:el.scrollWidth-el.clientWidth};thumb.classList.add('drag');try{thumb.setPointerCapture(e.pointerId)}catch(_){}});
    thumb.addEventListener('pointermove',function(e){if(!drag)return;el.scrollLeft=drag.sl+((e.clientX-drag.x)/drag.range)*drag.max});
    thumb.addEventListener('pointerup',function(e){drag=null;thumb.classList.remove('drag');try{thumb.releasePointerCapture(e.pointerId)}catch(_){}});
  }
  if(bar)bar.addEventListener('pointerdown',function(e){if(e.target===thumb)return;const r=bar.getBoundingClientRect();el.scrollLeft=((e.clientX-r.left)/r.width)*(el.scrollWidth-el.clientWidth);update()});
  window._chipsUpdate=update;
  if(!window._chipsResizeBound){window.addEventListener('resize',function(){if(window._chipsUpdate)window._chipsUpdate()});window._chipsResizeBound=true}
  update();
}

  }).join('');

function recipeText(r){
  const L=[r.name]; if(r.src)L.push("Receta de "+r.src); L.push("");
  L.push(`INGREDIENTES (${r.servings} raciones)`);
  r.preps.forEach(p=>{if(r.preps.length>1)L.push(p.name+":");p.ings.forEach(ig=>L.push("• "+`${ig.q?fmtQty(ig.q)+(ig.u?' '+ig.u:''):''} ${ig.n}${ig.opt?' (opcional)':''}`.replace(/\s+/g,' ').trim()))});
  L.push("","PREPARACIÓN");
  r.preps.forEach(p=>{if(r.preps.length>1)L.push(p.name+":");p.steps.forEach((s,i)=>L.push(`${i+1}. ${s.t}${s.opt?' (opcional)':''}`))});
  if(r.yt)L.push("","Vídeo: "+r.yt);
  L.push("","— Compartido desde Lapiko");
  return L.join("\n");
}

function shareData(r){
  const d={oid:r.oid||null,name:r.name,cat:(Array.isArray(r.cat)?r.cat:(Array.isArray(r.tags)?r.tags:[])),servings:r.servings,time:r.time,active:r.active,diff:r.diff,cost:r.cost,yt:r.yt,src:r.src,preps:r.preps};
  Object.keys(d).forEach(k=>{const v=d[k];if(v===null||v===undefined||v===""||(Array.isArray(v)&&!v.length))delete d[k]});
  return d;
}
const B64U={
  enc(bytes){let s="";bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")},
  dec(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const bin=atob(str),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
};
async function encodeRecipeC(r){
  const json=JSON.stringify(shareData(r));
  if(typeof CompressionStream==="undefined")return null;
  try{
    const cs=new CompressionStream("deflate-raw");
    const w=cs.writable.getWriter();w.write(new TextEncoder().encode(json));w.close();
    const buf=await new Response(cs.readable).arrayBuffer();
    return B64U.enc(new Uint8Array(buf));
  }catch(e){return null}
}
async function decodeRecipeC(code){
  const ds=new DecompressionStream("deflate-raw");
  const w=ds.writable.getWriter();w.write(B64U.dec(code));w.close();
  const buf=await new Response(ds.readable).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(buf));
}
function encodeRecipe(r){try{return btoa(unescape(encodeURIComponent(JSON.stringify(shareData(r)))))}catch(e){return ""}}
function shareUrl(r){return location.origin+location.pathname+"#r="+encodeRecipe(r)}
function randCode(n){
  const A="abcdefghijkmnpqrstuvwxyz23456789";let out="";
  try{const b=new Uint8Array(n);crypto.getRandomValues(b);for(let i=0;i<n;i++)out+=A[b[i]%A.length]}
  catch(e){for(let i=0;i<n;i++)out+=A[Math.floor(Math.random()*A.length)]}
  return out;
}
async function shareUrlLong(r){const c=await encodeRecipeC(r);return c?location.origin+location.pathname+"#c="+c:shareUrl(r)}
async function shareUrlBest(r){
  if(Cloud.on&&Cloud.ready&&r&&r.id!=="shared"){
    try{
      const code=r.share||randCode(9);
      const ok=await Cloud.putShare(code,JSON.stringify(shareData(r)));
      if(ok){
        if(r.share!==code){r.share=code;persist()}
        return location.origin+location.pathname+"#s="+code;
      }
    }catch(e){}
  }
  return shareUrlLong(r);
}
async function copyLink(){

}

function findDup(o){
  if(o.oid){const m=recipes.find(r=>r.oid&&r.oid===o.oid);if(m)return {r:m,by:"oid"}}
  const n=normName(o.name);
  const m2=recipes.find(r=>normName(r.name)===n);
  return m2?{r:m2,by:"name"}:null;
}
function saveImported(o){
  const c=JSON.parse(JSON.stringify(o));
  c.id="r"+(++idSeq); c.log=[]; c.fav=false; c.wish=false;
  c.added=(recipes.length?Math.max(...recipes.map(x=>x.added||0)):0)+1;
  normRecipe(c,recipes.length);
  if(!c.oid)c.oid=newOid();
  c.lpk=++lpkSeq;
  recipes.push(c); persist();
  history.replaceState(null,"",location.pathname);
  pendingClear();
  toast("Receta agregada a tu recetario");
  openRecipe(c.id);
  return c;
}
function importShared(o){

async function handleRoute(){
  const h=location.hash;
  if(h.indexOf("#s=")===0){
    const code=h.slice(3).replace(/[^a-z0-9]/gi,"");
    view.innerHTML='<div class="empty"><p>Abriendo la receta…</p></div>';
    state.view="shared";setActiveNav("home");
    const json=await Cloud.getShare(code);
    if(json){
      try{
        const r=JSON.parse(json);
        if(!Array.isArray(r.cat))r.cat=[];
        if(!Array.isArray(r.preps))r.preps=[];
        r.id="shared";r.log=[];r.fav=false;r.wish=false;
        state.recipe=r;renderShared();return;
      }catch(e){}
    }
    view.innerHTML='<div class="empty"><p>Este enlace ya no está disponible.<br>Pídele a quien te lo envió que vuelva a compartirlo.</p><button class="btn btn-ghost" style="margin-top:14px" onclick="history.replaceState(null,\'\',location.pathname);go(\'home\')">Ir a Lapiko</button></div>';
    return;
  }
  const isC=h.indexOf("#c=")===0, isR=h.indexOf("#r=")===0;
  if(isC||isR){
    try{
      const r=isC?await decodeRecipeC(h.slice(3)):JSON.parse(decodeURIComponent(escape(atob(h.slice(3)))));
      if(!Array.isArray(r.cat))r.cat=Array.isArray(r.tags)?r.tags:[];
      if('tags' in r)delete r.tags;
      if(!Array.isArray(r.preps))r.preps=[];
      r.id="shared";r.log=[];r.fav=false;r.wish=false;
      state.recipe=r;setActiveNav("home");state.view="shared";renderShared();return;
    }catch(e){}
  }
  go("home");
}

let _tdrag=null;
function tagDragStart(e,h){e.preventDefault();const row=h.closest('.tagrow');if(!row)return;_tdrag={row,cont:row.parentElement};row.classList.add('dragging');document.addEventListener('pointermove',tagDragMove,{passive:false});document.addEventListener('pointerup',tagDragEnd);document.addEventListener('pointercancel',tagDragEnd)}
function tagDragMove(e){if(!_tdrag)return;e.preventDefault();const y=e.clientY;const rows=[..._tdrag.cont.querySelectorAll(':scope > .tagrow')].filter(r=>r!==_tdrag.row);let before=null;for(const r of rows){const b=r.getBoundingClientRect();if(y<b.top+b.height/2){before=r;break}}if(before)_tdrag.cont.insertBefore(_tdrag.row,before);else _tdrag.cont.appendChild(_tdrag.row)}
function tagDragEnd(){if(!_tdrag)return;_tdrag.row.classList.remove('dragging');document.removeEventListener('pointermove',tagDragMove);document.removeEventListener('pointerup',tagDragEnd);document.removeEventListener('pointercancel',tagDragEnd);_tdrag=null;saveTagOrder()}

function dragStart(e,h){e.preventDefault();const row=h.closest('.dyn-row');if(!row)return;_drag={row,cont:row.parentElement};row.classList.add('dragging');document.addEventListener('pointermove',dragMove,{passive:false});document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd)}
function dragMove(e){if(!_drag)return;e.preventDefault();const y=e.clientY;const rows=[..._drag.cont.querySelectorAll(':scope > .dyn-row')].filter(r=>r!==_drag.row);let before=null;for(const r of rows){const b=r.getBoundingClientRect();if(y<b.top+b.height/2){before=r;break}}if(before)_drag.cont.insertBefore(_drag.row,before);else _drag.cont.appendChild(_drag.row)}

function renderCook(){
  const r=state.recipe,steps=flatSteps(r),s=steps[cookIdx],multi=r.preps.length>1;
  $("#cookTitle").textContent=r.name;
  $("#cookProg").innerHTML=`${(multi&&s.prep)?`<span style="color:var(--accent)">${esc(s.prep)}</span> · `:''}Paso ${cookIdx+1} de ${steps.length}`;
  $("#cookStep").innerHTML=(s.opt?'<span class="step-opt">Opcional</span> ':'')+esc(s.t);
  $("#cookNext").textContent=cookIdx===steps.length-1?"Terminar":"Siguiente →";
  $(".cook-nav .prev").style.visibility=cookIdx===0?'hidden':'visible';
  stopTimer();
  const tw=$("#cookTimer");
  if(s.m){tw.classList.add("show");timeLeft=s.m*60;updateTT();$("#cookTimerBtn").textContent="Iniciar ▶"}else tw.classList.remove("show");
  const up=steps.slice(cookIdx+1,cookIdx+3),upEl=$("#cookUp");
  if(up.length){upEl.innerHTML=`<div class="up-h">A continuación</div>`+up.map((u,j)=>{const g=cookIdx+1+j,np=multi&&steps[g].prep!==steps[g-1].prep;return `<div class="up-item"><span class="up-n">${g+1}</span><div>${np?`<span class="up-prep">▸ ${esc(u.prep)}</span>`:''}${esc(u.t)}</div></div>`}).join("");upEl.style.display='block'}else{upEl.innerHTML='';upEl.style.display='none'}

function updateTT(){const m=Math.floor(timeLeft/60),s=timeLeft%60;$("#cookTT").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function toggleTimer(){if(running){stopTimer();$("#cookTimerBtn").textContent="Reanudar ▶";return}running=true;$("#cookTimerBtn").textContent="Pausar ⏸";timer=setInterval(()=>{timeLeft--;updateTT();if(timeLeft<=0){stopTimer();$("#cookTimer").classList.add("ring");$("#cookTimerBtn").textContent="¡Listo!";toast("¡Tiempo!")}},1000)}

/* ---------- TEMPORIZADORES ---------- */
let timers=[],tSeq=0,ticker=null,actx=null;
function tSave(){try{localStorage.setItem("lapiko_timers",JSON.stringify({timers,tSeq}))}catch(e){}}
function tRestore(){
  try{
    const d=JSON.parse(localStorage.getItem("lapiko_timers")||"null");
    if(!d||!Array.isArray(d.timers))return;
    timers=d.timers; tSeq=d.tSeq||0;
    const now=Date.now();
    timers.forEach(t=>{
      if(t.running&&t.endAt){
        const rem=Math.ceil((t.endAt-now)/1000);
        if(rem<=0){t.running=false;t.fin=true;t.remaining=0}else t.remaining=rem;
      }
    });
    if(timers.some(t=>t.running))ensureTicker();
    const vencidos=timers.filter(t=>t.fin&&!t.seen);
    renderTimers();updateFab();
    if(vencidos.length){vencidos.forEach(t=>{t.seen=true;if(!alarmQ.some(x=>x.id===t.id))alarmQ.push(t)});tSave();renderAlarm();startAlarmNoise()}
  }catch(e){}
}
function fmtClock(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,"0");return h?`${h}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`}
function openTimers(){renderTimers();$("#sheetBack").classList.add("show")}
function closeTimers(e){if(!e||e.target===$("#sheetBack"))$("#sheetBack").classList.remove("show")}
function ensureTicker(){if(!ticker)ticker=setInterval(tickT,1000)}
function tickT(){const now=Date.now();if(!timers.some(t=>t.running))keepAwake(false);timers.forEach(t=>{if(t.running&&t.endAt){const rem=Math.ceil((t.endAt-now)/1000);t.remaining=Math.max(0,rem);if(rem<=0){t.running=false;t.fin=true;t.remaining=0;fireAlarm(t)}}});tSave();renderTimers();updateFab();if(!timers.some(t=>t.running||t.fin)){clearInterval(ticker);ticker=null}}
function primeTimerEnv(){
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}
  try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}
  keepAwake(true);
}
function addTimer(sec,label){primeTimerEnv();timers.push({id:++tSeq,label:label||"",total:sec,remaining:sec,running:true,fin:false,endAt:Date.now()+sec*1000});ensureTicker();tSave();renderTimers();updateFab();openTimers()}
function addCustom(){const m=parseInt($("#cMin").value)||0,s=parseInt($("#cSec").value)||0,tot=m*60+s;if(tot<=0){toast("Pon un tiempo");return}addTimer(tot,$("#cLbl").value.trim());$("#cMin").value="";$("#cSec").value="";$("#cLbl").value=""}
function tToggle(id){const t=timers.find(x=>x.id===id);if(!t)return;if(t.fin){t.remaining=t.total;t.fin=false;t.running=true}else t.running=!t.running;t.endAt=t.running?Date.now()+t.remaining*1000:null;ensureTicker();tSave();renderTimers();updateFab()}
function tAdd1(id){const t=timers.find(x=>x.id===id);if(t){t.remaining+=60;t.total+=60;t.fin=false;t.running=true;t.endAt=Date.now()+t.remaining*1000;ensureTicker();tSave();renderTimers();updateFab()}}
function tDel(id){timers=timers.filter(x=>x.id!==id);tSave();renderTimers();updateFab()}
function renderTimers(){const el=$("#timerList");if(!el)return;if(!timers.length){el.innerHTML='<div class="tempty">No hay temporizadores en marcha.<br>Añade uno con los botones de arriba.</div>';return}el.innerHTML=timers.map(t=>`<div class="titem ${t.fin?'fin':''}"><div class="tclock">${t.fin?'¡Listo!':fmtClock(t.remaining)}</div><div class="tinfo"><div class="tlbl">${esc(t.label||'Temporizador')}</div><div class="tsub">${fmtClock(t.total)} en total</div></div><div class="tbtns"><button onclick="tAdd1(${t.id})" title="+1 min">+1′</button><button onclick="tToggle(${t.id})">${t.fin?'↺':(t.running?'⏸':'▶')}</button><button onclick="tDel(${t.id})">✕</button></div></div>`).join("")}
function fabShouldShow(){
  if(timers.length)return true;
  const ck=document.getElementById("cook");
  if(ck&&ck.classList.contains("show"))return true;
  return state.view==="detail";
}
function updateFab(){const fab=$("#fabTimer");if(!fab)return;fab.classList.toggle("hide",!fabShouldShow());const live=$("#fabLive"),fin=timers.some(t=>t.fin),running=timers.filter(t=>t.running);fab.classList.toggle("ring",fin);let badge=fab.querySelector(".fab-badge");if(!timers.length){fab.classList.remove("active");live.textContent="";badge&&badge.remove();return}fab.classList.add("active");const show=fin?timers.find(t=>t.fin):(running.slice().sort((a,b)=>a.remaining-b.remaining)[0]||timers[0]);live.textContent=show.fin?"¡Listo!":fmtClock(show.remaining);if(timers.length>1){if(!badge){badge=document.createElement("span");badge.className="fab-badge";fab.appendChild(badge)}badge.textContent=timers.length}else badge&&badge.remove()}
let alarmQ=[], alarmLoop=null, wakeLock=null;
function fireAlarm(t){
  t.seen=true;
  if(!alarmQ.some(x=>x.id===t.id))alarmQ.push(t);
  renderAlarm(); startAlarmNoise(); notify(t);
}
function renderAlarm(){
  const el=$("#alarm"); if(!el)return;
  if(!alarmQ.length){el.classList.remove("show");return}
  const t=alarmQ[0];
  $("#alarmLabel").textContent=t.label||"";
  $("#alarmKicker").textContent=t.label?"Temporizador terminado":"Tiempo cumplido";
  $("#alarmClock").textContent=fmtClock(0);
  $("#alarmMore").textContent=alarmQ.length>1?`Y ${alarmQ.length-1} más esperando`:"";
  el.classList.add("show");
}
function startAlarmNoise(){
  if(alarmLoop)return;
  const ring=()=>{beep();try{if(navigator.vibrate)navigator.vibrate([350,180,350])}catch(e){}};
  ring(); alarmLoop=setInterval(ring,1600);
}
function stopAlarmNoise(){
  if(alarmLoop){clearInterval(alarmLoop);alarmLoop=null}
  try{if(navigator.vibrate)navigator.vibrate(0)}catch(e){}
}
function alarmNext(){
  alarmQ.shift();
  if(alarmQ.length){renderAlarm()}
  else{stopAlarmNoise();$("#alarm").classList.remove("show")}
  tSave();renderTimers();updateFab();
}
function alarmStop(){const t=alarmQ[0];if(t)timers=timers.filter(x=>x.id!==t.id);alarmNext()}
function alarmPlus(){const t=alarmQ[0];if(t){t.fin=false;t.running=true;t.remaining=60;t.total+=60;t.endAt=Date.now()+60000;ensureTicker()}alarmNext();toast("+1 minuto")}
function alarmRepeat(){const t=alarmQ[0];if(t){t.fin=false;t.running=true;t.remaining=t.total;t.endAt=Date.now()+t.total*1000;ensureTicker()}alarmNext();toast("Temporizador reiniciado")}
function notify(t){
  try{
    if(!("Notification" in window)||Notification.permission!=="granted")return;
    if(document.visibilityState==="visible")return;
    new Notification("Lapiko · tiempo cumplido",{body:t.label||"Tu temporizador ha terminado",icon:"icon-192.png",tag:"lapiko-timer-"+t.id});
  }catch(e){}
}
async function keepAwake(on){
  try{
    if(on){ if(!wakeLock&&navigator.wakeLock)wakeLock=await navigator.wakeLock.request("screen"); }
    else if(wakeLock){await wakeLock.release();wakeLock=null}
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    const now=Date.now();
    timers.forEach(t=>{if(t.running&&t.endAt&&t.endAt<=now){t.running=false;t.fin=true;t.remaining=0;fireAlarm(t)}});
    if(timers.some(t=>t.running))keepAwake(true);
    tSave();renderTimers();updateFab();
  }
});
function beep(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();let n=0;const pulse=()=>{const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.28,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.35);o.start();o.stop(actx.currentTime+.37);if(++n<3)setTimeout(pulse,430)};pulse()}catch(e){}}

/* ---------- MODAL GENÉRICO ---------- */
function openModal(html){$("#modalSheet").innerHTML=html;$("#modalBack").classList.add("show")}
function closeModal(e){if(!e||e.target===$("#modalBack"))$("#modalBack").classList.remove("show")}
/* ---------- GESTOS TÁCTILES (deslizar para cerrar / volver) ---------- */
function setupGestures(){
  let sx=0,sy=0,st=0,mode=null,scrollEl=null,sheetClose=null;
  function openOverlay(){
    const ck=$("#cook"); if(ck&&ck.classList.contains("show"))return {scroll:ck,close:closeCook};
    const mb=$("#modalBack"); if(mb&&mb.classList.contains("show"))return {scroll:$("#modalSheet"),close:function(){closeModal()}};
    const sb=$("#sheetBack"); if(sb&&sb.classList.contains("show"))return {scroll:sb.querySelector(".sheet"),close:function(){closeTimers()}};
    return null;
  }
  function inHScroller(el){while(el&&el!==document.body){try{if(el.scrollWidth>el.clientWidth+4){const ox=getComputedStyle(el).overflowX;if(ox==="auto"||ox==="scroll")return true}}catch(_){}el=el.parentElement}return false}
  document.addEventListener("touchstart",function(e){
    if(!e.touches||e.touches.length!==1){mode=null;return}
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); mode=null; scrollEl=null; sheetClose=null;
    const ov=openOverlay();
    if(ov){mode="sheet";scrollEl=ov.scroll;sheetClose=ov.close;return}
    if((state.view==="detail"||state.view==="shared") && sx>window.innerWidth*0.5 && !inHScroller(e.target)){mode="back"}
  },{passive:true});
  document.addEventListener("touchend",function(e){
    if(!mode)return;
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy, dt=Date.now()-st;
    if(mode==="sheet"){
      if(dy>70 && dy>Math.abs(dx)*1.4 && (!scrollEl||scrollEl.scrollTop<=2) && sheetClose)sheetClose();
    }else if(mode==="back"){
      if(dx<-55 && Math.abs(dx)>Math.abs(dy)*1.8 && dt<800)go("home");
    }
    mode=null;
  },{passive:true});
}
setupGestures();
